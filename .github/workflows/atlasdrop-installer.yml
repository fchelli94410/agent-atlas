name: Build verified Atlas Drop installer

on:
  push:
    branches:
      - agent/installer-windows-autonome
  pull_request:
    paths:
      - 'AtlasDrop/**'
      - '.github/workflows/atlasdrop-installer.yml'
  workflow_dispatch:

jobs:
  build-test-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AtlasDrop/AtlasDrop-Sprint01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AtlasDrop.sln --disable-parallel
      - name: Build
        run: dotnet build AtlasDrop.sln -c Release --no-restore --warnaserror
      - name: Test
        run: dotnet test AtlasDrop.sln -c Release --no-build --logger "trx;LogFileName=atlasdrop-tests.trx"
      - name: Publish autonomous Windows application
        run: dotnet publish src/AtlasDrop.App/AtlasDrop.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o installer/publish
      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress -y
      - name: Build single EXE installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.9" "installer\AtlasDrop.iss"'
      - name: Silent install smoke test
        shell: powershell
        run: |
          $installer = Resolve-Path "installer\output\Installer-Atlas-Drop.exe"
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'AtlasDrop\AtlasDrop.App.exe'
          if (-not (Test-Path -LiteralPath $app)) { throw 'Installed executable missing.' }
          Start-Process -FilePath $app -WorkingDirectory (Split-Path $app)
          Start-Sleep -Seconds 5
          if ($null -eq (Get-Process -Name 'AtlasDrop.App' -ErrorAction SilentlyContinue)) { throw 'Atlas Drop did not stay running.' }
          Stop-Process -Name 'AtlasDrop.App' -Force
          $uninstaller = Join-Path $env:LOCALAPPDATA 'AtlasDrop\unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath $app) { throw 'Uninstall left the executable behind.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Installer-Atlas-Drop-Windows
          path: AtlasDrop/AtlasDrop-Sprint01/installer/output/Installer-Atlas-Drop.exe
          if-no-files-found: error
